data_loader: HydroLoader
data_sampler: HydroSampler
defaults:
- _self_
- hydra: settings
- observations: camels_559
delta_model:
  nn_model:
    attributes:
    - p_mean
    - pet_mean
    - p_seasonality
    - frac_snow
    - aridity
    - high_prec_freq
    - high_prec_dur
    - low_prec_freq
    - low_prec_dur
    - elev_mean
    - slope_mean
    - area_gages2
    - frac_forest
    - lai_max
    - lai_diff
    - gvf_max
    - gvf_diff
    - dom_land_cover_frac
    - dom_land_cover
    - root_depth_50
    - soil_depth_pelletier
    - soil_depth_statsgo
    - soil_porosity
    - soil_conductivity
    - max_water_content
    - sand_frac
    - silt_frac
    - clay_frac
    - geol_1st_class
    - glim_1st_class_frac
    - geol_2nd_class
    - glim_2nd_class_frac
    - carbonate_rocks_frac
    - geol_porosity
    - geol_permeability
    batch_size: 200
    dr: 0.0
    forcings:
    - prcp
    - tmean
    - pet
    hidden_size: 64
    model: Calibrate
  phy_model:
    attributes: []
    check_water_balance: true
    dy_drop: 0.0
    forcings:
    - prcp
    - tmean
    - pet
    model:
    - UnifyV2
    model_name: xinanjiang
    nearzero: 1e-6
    nmul: 256
    use_log_norm: []
    warm_up: 365
    warm_up_states: false
  rho: 365
device: cuda
gpu_id: 0
loss_function:
  model: KgeLoss
mode: train
random_seed: 42
save_path: project/diff_compare/ablation/nmul
simulation:
  batch_size: 25
  end_time: 2014/09/30
  start_time: 2012/10/01
test:
  batch_size: 100
  end_time: 2009/12/31
  metrics:
  - kge
  split_dataset: false
  start_time: 1999/01/01
  test_epoch: 100
train:
  batch_size: 200
  end_time: 1998/12/31
  epochs: 100
  learning_rate: 1.0
  lr_scheduler: None
  lr_scheduler_params:
    gamma: 0.5
    step_size: 10
  optimizer: Adadelta
  save_epoch: 1
  start_epoch: 0
  start_time: 1989/01/01
  target:
  - streamflow
trained_model: project/diff_compare/ablation/batchsize/model/
trainer: CalTrainer
