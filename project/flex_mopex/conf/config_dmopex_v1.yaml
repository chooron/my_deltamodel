defaults:
- _self_
- hydra: settings
- observations: camels_671
mode: train
random_seed: 42
device: cuda
gpu_id: 0
data_loader: HydroLoader
data_sampler: HydroSampler
trainer: NewTrainer
save_output: true
save_path: project/flex_mopex/output/flex_mopex_v1/alpha_1
trained_model: project/flex_mopex/output/flex_mopex_v1/alpha_1/model/
train:
  start_time: 1980/10/01
  end_time: 1995/09/30
  target:
  - streamflow
  loss_kwargs_mode: weights
  optimizer: Adadelta
  batch_size: 100
  epochs: 50
  start_epoch: 0
  save_epoch: 5
  learning_rate: 1.0
  lr_scheduler: None
  lr_scheduler_params:
    step_size: 10
    gamma: 0.5
test:
  start_time: 1995/10/01
  end_time: 2010/09/30
  batch_size: 100
  test_epoch: 50
  split_dataset: true
simulation:
  start_time: 2012/10/01
  end_time: 2014/09/30
  batch_size: 25
loss_function:
  model: NseAicBatchLoss
  aic_alpha: 1.0
delta_model:
  rho: 365
  phy_model:
    directory: project\flex_mopex\models
    model:
    - FlexMopexV1
    nmul: 4
    warm_up: 365
    warm_up_states: false
    dy_drop: 0.0
    attributes: []
    use_log_norm: []
    nearzero: 1e-5
    forcings:
    - prcp
    - tmean
    - pet
  nn_model:
    directory: project\flex_mopex\models
    model: MultiHeadNet
    dr: 0.5
    hidden_size: 128
    forcings:
    - prcp
    - tmean
    - pet
    attributes:
    - p_mean
    - pet_mean
    - p_seasonality
    - frac_snow
    - aridity
    - high_prec_freq
    - high_prec_dur
    - low_prec_freq
    - low_prec_dur
    - elev_mean
    - slope_mean
    - area_gages2
    - frac_forest
    - lai_max
    - lai_diff
    - gvf_max
    - gvf_diff
    - dom_land_cover_frac
    - dom_land_cover
    - root_depth_50
    - soil_depth_pelletier
    - soil_depth_statsgo
    - soil_porosity
    - soil_conductivity
    - max_water_content
    - sand_frac
    - silt_frac
    - clay_frac
    - geol_1st_class
    - glim_1st_class_frac
    - geol_2nd_class
    - glim_2nd_class_frac
    - carbonate_rocks_frac
    - geol_porosity
    - geol_permeability
